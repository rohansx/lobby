{{define "title"}}Log in · Lobby{{end}}
{{define "content"}}
<div class="narrow">
  <h1>Lobby</h1>
  <p class="sub">Log in to manage your waitlists.</p>
  {{with .Error}}<div class="err">{{.}}</div>{{end}}
  <form method="post" action="/login" class="panel">
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required value="{{.Email}}" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <p style="margin-top:18px"><button type="submit">Log in</button></p>
  </form>
</div>
{{end}}
