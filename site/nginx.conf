server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Pages and the stylesheet change on every deploy; media rarely does.
    location ~* \.(html|css)$ { add_header Cache-Control "no-cache"; }
    location ~* \.(png|jpg|gif|webm|svg)$ { add_header Cache-Control "public, max-age=86400"; }

    # /pricing serves pricing.html.
    location / { try_files $uri $uri.html $uri/ =404; }
}
