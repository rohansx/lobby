# trylobby.app: this container serves the landing site and passes every
# other path (dashboard, API, hosted waitlist pages, widget) to Lobby Cloud.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS, so the upstream is looked up per request and nginx starts
    # even while the app is redeploying.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lobby http://lobby-cloud-mpaqe4:8080;

    # Old addresses and www go to the canonical domain.
    if ($host != "trylobby.app") {
        return 301 https://trylobby.app$request_uri;
    }

    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }

    # Site pages and media; anything not on disk falls through to the app.
    location ~* \.(html|css)$ { try_files $uri @lobby; add_header Cache-Control "no-cache"; }
    location ~* \.(png|jpg|gif|webm|svg)$ { try_files $uri @lobby; add_header Cache-Control "public, max-age=86400"; }
    location / { try_files $uri $uri.html @lobby; }

    location @lobby {
        proxy_pass $lobby;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Pass Traefik's header through unchanged: Lobby trusts its last
        # entry as the client address, so nginx must not append its own.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 120s;
        proxy_buffering off;
        client_max_body_size 2m;
    }
}
